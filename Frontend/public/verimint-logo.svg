<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Elegant gradient for borders -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb7185;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle glow for elegance -->
    <filter id="elegantGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main centered content group -->
  <g transform="translate(100, 105)">
    <!-- Bold Geometric V shape -->
    <g transform="translate(0, -45) scale(1.4)" stroke="url(#borderGrad)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#elegantGlow)">
      <!-- Left part of V -->
      <path d="M -35,0 L -10,50"/>
      <!-- Right part of V -->
      <path d="M 35,0 L 10,50"/>
      <!-- Bottom point -->
      <path d="M -10,50 L 0,65 L 10,50"/>
    </g>
    
    <!-- Bold checkmark - positioned higher between V arms -->
    <path 
      transform="translate(0, -30) scale(1.3)"
      d="M -8,20 L -2,28 L 12,10" 
      stroke="url(#borderGrad)" 
      stroke-width="5" 
      fill="none"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.85"
    />
    
    <!-- Two blockchain dots with connection - properly arranged -->
    <g opacity="0.6" transform="translate(0, 20)">
      <circle cx="-25" cy="0" r="3.5" fill="url(#borderGrad)"/>
      <circle cx="25" cy="0" r="3.5" fill="url(#borderGrad)"/>
      
      <line x1="-25" y1="0" x2="25" y2="0" stroke="url(#borderGrad)" stroke-width="2.5" opacity="0.7"/>
    </g>
    
    <!-- Bold shopping cart -->
    <g transform="translate(0, 50) scale(1.4)" stroke="url(#borderGrad)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Cart body -->
      <path d="M -15,-6 L -10,-6 L -5,8 L 12,8"/>
      <!-- Cart wheels -->
      <circle cx="-1" cy="13" r="3"/>
      <circle cx="10" cy="13" r="3"/>
    </g>
  </g>
</svg>